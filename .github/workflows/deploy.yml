name: Deploy website to GitHub Pages

on:
  # Deploy whenever a release tag is pushed, e.g. v1.0.0
  push:
    tags:
      - 'v*'
  # Allow a manual deploy from the Actions tab, on any branch
  workflow_dispatch:

env:
  # Production domain. While this is empty the site is published to the
  # github.io preview URL instead, with the absolute URLs rewritten and search
  # engines kept out. Set it to open-rag.ai once the DNS records are in place.
  CUSTOM_DOMAIN: ''

# Grant the token the permissions required by the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; never cancel one in flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage the static site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          DOMAIN="${CUSTOM_DOMAIN:-}"
          BASE_URL="${BASE_URL:-}"

          mkdir -p _site
          # Copy the whole site, minus hidden files, documentation and archives
          rsync -a --delete \
            --exclude='.*' \
            --exclude='_site/' \
            --exclude='*.md' \
            --exclude='*.zip' \
            ./ _site/
          # Tell Pages to serve the files as-is, without Jekyll processing
          touch _site/.nojekyll

          if [ -n "$DOMAIN" ]; then
            # Production: the custom domain must travel with the artifact, and
            # the site is published exactly as authored
            echo "$DOMAIN" > _site/CNAME
            echo "::notice::Publishing to https://$DOMAIN/"
          else
            # Preview: no CNAME, so Pages serves the github.io URL
            rm -f _site/CNAME

            # The site is authored for the apex domain but served from a
            # subpath here, so repoint the absolute URLs. Relative links,
            # assets and anchors already work unchanged.
            mapfile -t rewritable < <(
              grep -rl --include='*.html' --include='*.xml' --include='*.txt' \
                'https://open-rag.ai' _site || true
            )
            if [ "${#rewritable[@]}" -gt 0 ]; then
              sed -i "s#https://open-rag\.ai#${BASE_URL%/}#g" "${rewritable[@]}"
            fi

            # Keep the preview out of search results so it never competes with
            # the production domain
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
            sed -i \
              's#<meta name="robots" content="[^"]*">#<meta name="robots" content="noindex, nofollow">#' \
              _site/index.html

            echo "::notice::Publishing a preview to ${BASE_URL}/ (noindex, no custom domain)"
          fi

      - name: Verify the staged site
        run: |
          set -euo pipefail
          DOMAIN="${CUSTOM_DOMAIN:-}"

          for f in index.html robots.txt sitemap.xml .nojekyll \
                   css/site.css js/site.js images/OpenRAG-logo.svg; do
            if [ ! -f "_site/$f" ]; then
              echo "::error::Missing expected file in the site artifact: $f"
              exit 1
            fi
          done

          if [ -n "$DOMAIN" ]; then
            # The domain in the artifact drives the Pages custom-domain setting
            if [ "$(cat _site/CNAME)" != "$DOMAIN" ]; then
              echo "::error::_site/CNAME does not match CUSTOM_DOMAIN"
              exit 1
            fi
          else
            # A stray CNAME would send the preview to a domain that is not ready
            if [ -f _site/CNAME ]; then
              echo "::error::CNAME must not be deployed in preview mode"
              exit 1
            fi
            # Every absolute URL must have been repointed at the preview
            if grep -rq 'open-rag\.ai' _site; then
              echo "::error::Preview still contains references to the production domain:"
              grep -rn 'open-rag\.ai' _site || true
              exit 1
            fi
            if ! grep -q 'noindex' _site/index.html; then
              echo "::error::Preview index.html is missing the noindex directive"
              exit 1
            fi
          fi

          echo "Staged site contents:"
          find _site -type f | sort
          echo "Total size: $(du -sh _site | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
